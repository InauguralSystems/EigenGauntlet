name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build EigenScript
        run: |
          git clone --branch v0.48.0 --depth 1 https://github.com/InauguralSystems/EigenScript.git /tmp/eigenscript
          cd /tmp/eigenscript && make build
          echo "/tmp/eigenscript/src" >> $GITHUB_PATH

      - name: Run smoke suite
        run: tests/run_smoke.sh

      - name: Lint EigenScript sources (warnings are errors; W021 hints are advisory)
        run: |
          git ls-files -z 'gauntlet.eigs' 'src/*.eigs' 'lib/*.eigs' 'fixtures/*.eigs' |
            xargs -0 -n 1 eigenscript --lint

      - name: Run the tape crossing (two child interpreters, own suite)
        run: eigenscript gauntlet.eigs --suite cross-tape
